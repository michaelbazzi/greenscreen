<svg viewBox="0 0 1650 990" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GreenScreen production workflow as an n8n-style canvas, revised 2026-09-12. A schedule trigger runs four cycles a day through seven steps: status (circuit breaker, size ramp and deployable cash), stop-loss sweep, candidate screen, context from past outcomes, AI research over live web search, and a buy or sell proposal. The proposal reaches an independent risk gate: a technical score is still recomputed but is informational only since 2026-09-11 and no longer rejects anything, while the hard limits in risk_params.py decide, applying a halved size cap for 48 hours after any circuit-breaker trip. Passing proposals submit a paper order, failing ones log a rejection, and both are written to the decisions table before a summary notification. A weekly trigger reviews only decisions that actually executed, prices them then and now, and feeds the result back into context. A manual trigger runs the research scorecard, which scores each decision against a SPY buy-and-hold baseline and excludes dry-runs and hand-run tests. A separate manual trigger replays 2017 to 2026 history; that evidence is what demoted the technical score and disabled rotation.">
