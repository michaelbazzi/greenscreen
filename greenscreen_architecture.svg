<svg viewBox="0 0 1650 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GreenScreen production workflow rendered as an n8n-style canvas: a scheduled trigger runs seven research steps ending in a proposal, which passes through an independent risk gate that recomputes the score and checks hard limits, branching to order submission or rejection, both logged to a decisions table. A separate weekly trigger reviews outcomes and feeds them back into the context step. A separate manual trigger replays 2017-2026 history and, by hand, informs the gate's scoring weights.">
